spring.application.name=vestigia
server.port=${PORT:8080}

# DB_URL, DB_USER y DB_PASSWORD se buscan primero en las variables de entorno y luego en
# application-local.properties (opcional, ignorado por git). Si no existen, se usan estos valores de desarrollo.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vestigia}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health
vestigia.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Una sala viva sin actividad durante este tiempo pasa a expirada (formato ISO-8601 de Duration).
vestigia.salas.expiracion=PT2H
