spring.application.name=vestigia
server.port=${PORT:8080}

# DB_URL, DB_USER y DB_PASSWORD se buscan primero en las variables de entorno y luego en
# application-local.properties (opcional, ignorado por git). Si no existen, se usan estos valores de desarrollo.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vestigia}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health
vestigia.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Una sala viva sin actividad durante este tiempo pasa a expirada (formato ISO-8601 de Duration).
vestigia.salas.expiracion=PT2H
# Cada cuánto revisa el job las salas vencidas.
vestigia.salas.expiracion-revision=PT1M

# Tamaño máximo, en bytes, de los datos de un descubrimiento escritos como JSON compacto en UTF-8.
vestigia.descubrimientos.datos-max-bytes=4096

# Coordenadas del misterio. El servidor las entrega al resolver radio (coordenada_a, ascensión recta) y photo
# (coordenada_b, declinación). Se guardan como texto para conservar el signo y los ceros.
vestigia.puzzles.coordenadas.ar=137
vestigia.puzzles.coordenadas.dec=+042

# WebSocket en /ws. Plazo para que el cliente mande auth después de conectarse.
vestigia.ws.auth-plazo=PT5S
# Cada cuánto manda el servidor un ping a cada conexión autenticada.
vestigia.ws.ping=PT25S
# Tamaño máximo de un mensaje del cliente, en caracteres (en bytes si es binario). Uno más grande cierra con 1009.
vestigia.ws.mensaje-max-caracteres=4096
# Un envío a un cliente que no lee se corta tras este tiempo y cierra solo esa conexión.
vestigia.ws.envio-limite=PT5S
# Bytes que pueden esperar en la cola de salida de una conexión; más cierran esa conexión con 4500.
vestigia.ws.envio-max-bytes=65536
