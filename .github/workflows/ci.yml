name: CI

on:
  pull_request:
    branches: [develop, main]
  # Railway, con "Wait for CI", espera los checks del commit que despliega: necesitan correr también en push a main.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ./mvnw verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  docker:
    name: docker build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t vestigia-backend:ci .

